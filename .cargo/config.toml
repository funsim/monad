# This repository holds two toolchains, and both default their output to
# `target/`. Left alone they would share one directory: cargo's `debug/` and
# `release/` next to monad's store, so `cargo clean` would take monad's built
# artifacts with it and a `target/` listing would say nothing about which
# toolchain wrote what. They are named apart instead -- cargo's is
# `target-rust/` here, monad's is `target-monad/` (.monad/config.toml's
# `[build] target-dir`) -- and `target/` itself stays the monad default that an
# ordinary user's project, which has no Cargo.toml, still gets.
#
# `[build] target-dir` rather than `[env] CARGO_TARGET_DIR`, because a
# `[build]` path resolves relative to this file's own directory: it means the
# repository root from any working directory, `wasm/web` included.
#
# nix/host.nix pins CARGO_TARGET_DIR back to a literal `target`, which is
# deliberate and explained there -- nixpkgs' install hook looks in `target/`
# without reading this file.

[build]
target-dir = "target-rust"

[env]
RUST_MIN_STACK = { value = "16777216", force = true }
