name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every `nix develop -c` below would otherwise pay the devShell's shellHook,
  # `devenv-tasks run devenv:enterShell --mode all`. `--mode all` walks the
  # whole task graph in both directions, so entry reaches
  # `devenv:git-hooks:run` -- the full `prek run -a` (clippy, rustfmt,
  # shellcheck, docs-check, monad-check, `cargo test --release`): 521-559s cold
  # and 76-77s warm in this repo's job logs, seven times per pipeline, and only
  # one of those runs is any job's verdict. DEVENV_SKIP_TASKS is the shellHook's
  # own off switch -- devenv's tasks.nix guards the invocation with
  # `if [ -z "${DEVENV_SKIP_TASKS:-}" ]` and does nothing else with it -- so
  # setting it here suppresses every entry-time sweep, including the nested
  # entry the `devenv` CLI makes for `devenv tasks run` (the variable is
  # inherited), while leaving the one job that WANTS the sweep working:
  # `pre-commit-checks` runs `devenv tasks run devenv:git-hooks` explicitly, and
  # that is a separate devenv-tasks invocation. A job that genuinely needs the
  # entry sweep can opt back in with `env: DEVENV_SKIP_TASKS: ""` (the guard is a
  # `-z` test, so the empty string re-enables it). The shellHook's other lines --
  # the PATH exports, the `.devenv/run` symlink, `mkdir -p "$PREK_HOME"` -- sit
  # OUTSIDE the guard and are unaffected.
  DEVENV_SKIP_TASKS: "1"

jobs:
  pre-commit-checks:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      # The one step that stays a devenv task rather than calling a script
      # directly: `devenv:git-hooks:run` is `prek run -a` against
      # .pre-commit-config.yaml, which is gitignored and generated at run time
      # by devenv's own `devenv:files` task. Its output reaches this log because
      # devenv.nix sets `showOutput` on that task; without it devenv-tasks
      # would capture the per-hook output and print it only on failure.
      #
      # With DEVENV_SKIP_TASKS=1 set above, the entry-time sweep is off in every
      # step of every job. This explicit `devenv tasks run devenv:git-hooks` is
      # the ONLY run of the pre-commit suite in the pipeline, so this job's
      # verdict is decided here, not at shell entry. See the `showOutput` setting
      # in devenv.nix for why the per-hook results print on a green run.
      - name: Run pre commit checks
        run: nix develop --no-pure-eval --accept-flake-config -c devenv tasks run devenv:git-hooks

  test:
    runs-on: [self-hosted, linux]
    # Hang guard, not a deadline: a sandbox rung-1 build (~10-20 min, measured
    # on a dev machine rather than on this runner) plus the sweep, which is
    # ~50 min of the 56 min this step took on run 36197461023.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # The compiler this job sweeps comes from the flake. `packages.monad` IS
      # rung 1 -- the host interpreting cli/src/main.mo, from this commit's
      # tree, inside a nix sandbox -- wrapped so bare llc/clang/sh and boehmgc
      # are reachable, so the sweep runs the artifact the flake SHIPS rather
      # than a compiler this job happened to build. MONAD_BIN (which
      # scripts/check-monad-tests.sh honours) short-circuits its own rung-1
      # build, and this step replaces the old "Build release binary" rather
      # than joining it: `.#monad` takes `packages.monadHost` as a native
      # input, so a Rust compile error still fails HERE, in a step named for
      # the build, which is the property that step existed for.
      #
      # No `--no-pure-eval`, unlike every other nix invocation in this file:
      # this is an ordinary package build, and evaluating it purely is part of
      # what the flake is for. `--no-link --print-out-paths` so no `result`
      # symlink is left in the checkout for later steps to trip over.
      - name: Build the compiler from the flake
        run: |
          monad="$(nix build --no-link --print-out-paths --accept-flake-config .#monad)"
          echo "MONAD_BIN=$monad/bin/monad" >> "$GITHUB_ENV"

      # The script is called directly rather than through
      # `devenv tasks run monad:test` (its local equivalent): devenv-tasks
      # captures a task's stdout and shows it only on failure, which would
      # swallow the per-file verdicts that say what failed.
      - name: Run tests
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/check-monad-tests.sh

  bootstrap:
    runs-on: [self-hosted, linux]
    # Hang guard, not a compile deadline: the interpreted self-compile is
    # ~320s best case but stretches under load from the runner's own
    # parallel jobs; the host build (~4 min) plus two slow compiles still fits
    # far inside 90 min. A healthy run is never killed by this.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The host that runs this job's two rung-1 builds comes from the flake:
      # `packages.monadHost` is `cargo build -p monad-cli`, hermetically, and
      # MONAD_HOST_BIN is the knob scripts/build-self-hosted.sh already takes
      # for exactly this -- nix/monad.nix passes the same package the same way
      # (`lib.getExe`), and it is what removes `cargo run --release --`'s cold
      # fat-LTO build from this job. Nothing else here runs cargo, so the old
      # "Build release binary" step is gone rather than joined.
      #
      # The COMPILER is deliberately not taken from the flake here, unlike in
      # the `test` job: both rung-1 builds below assert the
      # interpreted-vs-compiled comparison, which needs the `.ll` the
      # interpreter writes beside its output, and a store compiler has none
      # beside it (nix/monad.nix does not install one). Only the host is
      # packaged; the ladder stays a from-source build, in both build modes.
      - name: Build the host from the flake
        run: |
          host="$(nix build --no-link --print-out-paths --accept-flake-config .#monadHost)"
          echo "MONAD_HOST_BIN=$host/bin/monad-rs" >> "$GITHUB_ENV"

      # Both steps call their script directly rather than through
      # `devenv tasks run monad:bootstrap-compile` / `monad:debug-oracle` (the
      # local equivalents): devenv-tasks captures a task's stdout and shows it
      # only on failure, and here the output IS the diagnostic -- the compile's
      # --verbose per-module stage trace, and the oracle's per-file verdicts.
      #
      # The two steps must stay in one job: the oracle reuses the binary the
      # compile wrote to ${TMPDIR:-/tmp}/monad-bootstrap-ci/monad.
      - name: Bootstrap compiler
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/bootstrap-compile.sh
      - name: Debug transparency oracle
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/debug-oracle.sh
