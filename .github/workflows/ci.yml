name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Per-ref, which for a pull request is `refs/pull/N/merge`: a new push to a
# PR cancels that PR's own previous run, which is the intent, and two PRs
# never cancel each other.
#
# Grouping on the PR's head branch instead was considered as a way to
# collapse "a PR's run and its branch's push" and DECLINED, because that
# duplicate cannot exist with these triggers: `push` is filtered to
# `branches: ["main"]`, so a push to a feature branch starts no workflow at
# all, and a branch's only runs are its PR's. What such a grouping would
# actually collapse is a push to `main` and the PR run of the commit before
# it -- i.e. it would cancel the post-merge verification of `main`, which is
# a defect rather than a saving. The 5413-9848 s queue waits in run
# 36301331844 are not this mechanism either: they are two runners serving
# three parallel jobs while another branch's pipeline holds both, and
# cancelling across refs would take capacity away from a branch that is
# legitimately queued.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every `nix develop -c` below would otherwise pay the devShell's shellHook,
  # `devenv-tasks run devenv:enterShell --mode all`. `--mode all` walks the
  # whole task graph in both directions, so entry reaches
  # `devenv:git-hooks:run` -- the full `prek run -a` (clippy, rustfmt,
  # shellcheck, docs-check, monad-check, `cargo test --release`): 521-559s cold
  # and 76-77s warm in this repo's job logs, seven times per pipeline, and only
  # one of those runs is any job's verdict. DEVENV_SKIP_TASKS is the shellHook's
  # own off switch -- devenv's tasks.nix guards the invocation with
  # `if [ -z "${DEVENV_SKIP_TASKS:-}" ]` and does nothing else with it -- so
  # setting it here suppresses every entry-time sweep, including the nested
  # entry the `devenv` CLI makes for `devenv tasks run` (the variable is
  # inherited), while leaving the one job that WANTS the sweep working:
  # `pre-commit-checks` runs `devenv tasks run devenv:git-hooks` explicitly, and
  # that is a separate devenv-tasks invocation. A job that genuinely needs the
  # entry sweep can opt back in with `env: DEVENV_SKIP_TASKS: ""` (the guard is a
  # `-z` test, so the empty string re-enables it). The shellHook's other lines --
  # the PATH exports, the `.devenv/run` symlink, `mkdir -p "$PREK_HOME"` -- sit
  # OUTSIDE the guard and are unaffected.
  DEVENV_SKIP_TASKS: "1"

# The three jobs run in PARALLEL, deliberately, and the pipeline's wall clock
# is the slowest of them (the `test` job) rather than their sum. `needs:`
# between them was considered and declined on the measurements, not on taste:
#
#   * `needs: pre-commit-checks` on `test`/`bootstrap` would delay the
#     critical-path job by the lint's own 9m32s on every GREEN run, because
#     the gate would then run before the job it gates instead of beside it.
#     (Run 36243944155: pre-commit 13:04:33-13:14:05 on one runner while
#     `test` ran 13:04:33-14:12:08 on the other.) What it buys is real but
#     different -- up to an hour of runner time not spent on a run that fails
#     formatting -- and that is a cost trade for the maintainer, not a wall
#     clock win, so it is not made here.
#   * `[self-hosted, linux, monad-ci]` (the label registered by
#     monad-nixos-modules' modules/github-runner.nix) was considered as a way
#     to stop paying a cold build. It would not help: the 16-20 min
#     "Build the compiler from the flake" step is the same on both runners
#     (16m11s on anders-desktop in run 36243944155, 19m58s on nixos-server in
#     run 36238059186) because `.#monad` depends on this commit's whole source
#     tree, so it is cold on EVERY commit. Pinning a job to one machine would
#     remove scheduling freedom and buy nothing. The fix for that step is a
#     binary cache shared by the two runners (nix-serve or attic) -- a
#     monad-nixos-modules change, not one this repo can make.
#
# A fourth job, `changes`, now precedes these three and gates the two
# compiler jobs. That is neither a reversal of the above nor the `needs:`
# that was declined there: it is a path classifier that costs seconds (one
# checkout and a `git diff`, no nix, no cargo), it gates only `test` and
# `bootstrap`, and what it does is SKIP a job on a change that cannot reach
# it rather than delay a green one behind a gate. It exists because a
# docs-only change -- the traffic that fills the queue -- otherwise buys a
# 54-minute job and a 22-minute one to learn nothing; see
# scripts/ci-compiler-relevant.sh for the rules and for why a workflow-level
# `paths-ignore` would be wrong here (it would skip `docs-check`, a
# pre-commit hook, on exactly the changes that need it).
#
# `pre-commit-checks` deliberately has NO `needs:`, so every run still
# reports a verdict -- a docs-only change is still linted, rustfmt'd,
# clippy'd and doc-checked, and no required check is left pending.
jobs:
  # Decides whether the two compiler jobs have anything to do. Answers over
  # an output because the gates below read it. `fetch-depth: 0` because the
  # classifier diffs the change against the commit the event names as its
  # base; the repository's whole pack is ~11.5 MiB, so the full history
  # costs seconds, and a base that cannot be fetched makes it answer `true`
  # (it fails OPEN), so even a wrong guess costs time rather than signal.
  changes:
    runs-on: [self-hosted, linux]
    outputs:
      compiler: ${{ steps.classify.outputs.compiler }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        name: Classify the change
        env:
          # `before` is the previous tip on a push and all zeros on a new
          # branch; `pull_request.base.sha` is the base tip. The script
          # treats both the zeros and an unreachable revision as `true`.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          decision="$(scripts/ci-compiler-relevant.sh "$BASE")"
          echo "compiler=$decision" >> "$GITHUB_OUTPUT"
          echo "compiler-relevant: $decision"

  pre-commit-checks:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5

      # The one step that stays a devenv task rather than calling a script
      # directly: `devenv:git-hooks:run` is `prek run -a` against
      # .pre-commit-config.yaml, which is gitignored and generated at run time
      # by devenv's own `devenv:files` task. Its output reaches this log because
      # devenv.nix sets `showOutput` on that task; without it devenv-tasks
      # would capture the per-hook output and print it only on failure.
      #
      # With DEVENV_SKIP_TASKS=1 set above, the entry-time sweep is off in every
      # step of every job. This explicit `devenv tasks run devenv:git-hooks` is
      # the ONLY run of the pre-commit suite in the pipeline, so this job's
      # verdict is decided here, not at shell entry. See the `showOutput` setting
      # in devenv.nix for why the per-hook results print on a green run.
      - name: Run pre commit checks
        run: nix develop --no-pure-eval --accept-flake-config -c devenv tasks run devenv:git-hooks

      # The `use`-completeness rule, ENFORCED. Every name a module reaches
      # from another module has to be named in its own `use` line (unless
      # ambient), and the same `check` invocation in the hook above reports
      # a violation as a warning and carries on -- a migration can proceed
      # file by file, which is how commit 9e948de3's corpus was fixed. This
      # step is the flip to a hard failure, and it is a step of its own
      # rather than an edit to devenv.nix's `monad-check` hook because the
      # pre-commit config is generated per checkout but SHARED by every
      # worktree on the machine: a hook that fails on an unimported name
      # would break commits in a sibling worktree still on a branch whose
      # corpus predates the migration.
      #
      # Same directory list as the hook, so the two can only disagree about
      # severity.
      - name: "`use` completeness (enforced)"
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            env MONAD_USE_COMPLETENESS=error cargo run --release -- \
              check init std examples lang cli llvm runtime build motes

  test:
    runs-on: [self-hosted, linux]
    # Gated on the classifier: a change that touches no compiler input has
    # nothing for this job to build or sweep. A skipped job still reports
    # (as `skipped`, which required checks treat as passing, unlike a
    # skipped WORKFLOW), so this cannot strand a merge the way a
    # workflow-level `paths-ignore` would.
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    # Hang guard, not a deadline: a sandbox rung-1 build plus the sweep. Both
    # halves of that are now measured rather than guessed (run 36243944155,
    # the last green one before this comment): the flake build was 16m11s
    # there and 19m58s in run 36238059186, on the OTHER runner -- so it is a
    # per-commit cold build of `.#monad`, not store luck, and not something a
    # label can fix. The sweep was 42m23s and the check 8m44s. Measured on
    # the full 197-file corpus with one binary, serial vs 7 shards:
    # 58m45s -> 25m35s for the whole script, at 2195/2195 tests either way.
    # That is the local figure; this step was 51m20s in CI.
    #
    # The shard count is no longer this comment's to claim: the "Settle the
    # CPU budget" step in the list below measures the runner's budget and
    # sets MONAD_SWEEP_JOBS from it. Run 36301331844 is why -- this comment
    # used to assert the default was "= 7 here" and that run shipped 3, i.e.
    # the `nproc` the sweep itself called returned 4 there. That turned out
    # not to be a disagreement but a FLEET: `runs-on: [self-hosted, linux]`
    # reaches two machines and the "Set up job" step names the one that took
    # the job. nixos-server (4 cores) gave 3 shards in 36301331844;
    # anders-desktop (8 cores) gave 7 in 36322856497. Both are correct, which
    # is why no literal belongs here.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # What this runner actually lets the sweep use, printed because the
      # answer differs per machine: this file once claimed the sharding
      # default was "= 7 here" while monad-nixos-modules' runner module
      # comments 8 vCPU as "matches the CI host's cores" and run 36301331844
      # shipped 3 shards. All three were right about different hosts. `runs-on:
      # [self-hosted, linux]` reaches nixos-server (4 cores) and
      # anders-desktop (8 cores), and "Set up job" names the one that took the
      # job -- so the two readings below are per-machine facts, not a
      # contradiction to explain away.
      #
      # MONAD_SWEEP_JOBS is SET from the measurement instead of being left to
      # the script's default, so the value stops depending on which
      # environment happened to ask. `nproc` already respects the process's
      # CPU affinity and the cgroup quota caps the CPU time it may actually
      # burn, so the smaller of the two is the budget.
      #
      # The budget IS the shard count -- one shard per core. The `nproc - 1`
      # that both this file and the sweep's default used to carry reserved a
      # core "for the machine", and run 36323615273 measured what it cost:
      # shard walls `947s 1425s 1425s`, i.e. 3797 s of work on 3 shards with
      # the 4-core runner's fourth core idle for the whole 1425 s critical
      # path. The cap of 8 is a guard on shard COUNT, not on memory -- the
      # memory claim it used to carry ("this corpus has OOM'd a box before")
      # does not describe this corpus: `monad test lang/src/scope.mo`, the
      # heaviest file in it, peaks at 172 MB of summed tree RSS (measured
      # 2026-09-27). It stays because no runner in this fleet has more than
      # 8 cores. A literal shard count is deliberately not written down: it
      # would be wrong on one of the two machines.
      #
      # The measurement is a script run INSIDE the dev shell, for a reason
      # that cost a red pipeline: a bare `run:` step gets the RUNNER HOST's
      # PATH, which has no `awk` and no `lscpu`. The first version of this
      # step was inlined here and run 36313431973's `test` job died 8 s in on
      #     line 4: lscpu: command not found
      #     line 7: awk: command not found
      #     Process completed with exit code 127
      # before it had measured anything at all -- having already printed the
      # host's `nproc` (8), because `nproc` and `uname` DO exist there. So
      # the host reading stays here, where it is reachable, and everything
      # that needs a real tool is in scripts/ci-cpu-budget.sh, which the dev
      # shell supplies them for. That script is also runnable by hand, which
      # is how this was checked rather than assumed.
      - name: Settle the CPU budget
        run: |
          echo "host nproc (affinity-aware, outside the dev shell): $(nproc)"
          echo "host nproc --all: $(nproc --all)"
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/ci-cpu-budget.sh

      # The compiler this job sweeps comes from the flake. `packages.monad` IS
      # rung 1 -- the host interpreting cli/src/main.mo, from this commit's
      # tree, inside a nix sandbox -- wrapped so bare llc/clang/sh and boehmgc
      # are reachable, so the sweep runs the artifact the flake SHIPS rather
      # than a compiler this job happened to build. MONAD_BIN (which
      # scripts/check-monad-tests.sh honours) short-circuits its own rung-1
      # build, and this step replaces the old "Build release binary" rather
      # than joining it: `.#monad` takes `packages.monadHost` as a native
      # input, so a Rust compile error still fails HERE, in a step named for
      # the build, which is the property that step existed for.
      #
      # No `--no-pure-eval`, unlike every other nix invocation in this file:
      # this is an ordinary package build, and evaluating it purely is part of
      # what the flake is for. `--no-link --print-out-paths` so no `result`
      # symlink is left in the checkout for later steps to trip over.
      - name: Build the compiler from the flake
        run: |
          monad="$(nix build --no-link --print-out-paths --accept-flake-config .#monad)"
          echo "MONAD_BIN=$monad/bin/monad" >> "$GITHUB_ENV"

      # The script is called directly rather than through
      # `devenv tasks run monad:test` (its local equivalent): devenv-tasks
      # captures a task's stdout and shows it only on failure, which would
      # swallow the per-file verdicts that say what failed.
      - name: Run tests
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/check-monad-tests.sh

  bootstrap:
    runs-on: [self-hosted, linux]
    # Same classifier as `test`, for the same reason: neither ladder reads a
    # markdown file or the generated docs, so a prose-only change cannot make
    # them fail.
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    # Hang guard, not a compile deadline: the interpreted self-compile is
    # ~320s best case but stretches under load from the runner's own
    # parallel jobs; the host build (~4 min) plus two slow compiles still fits
    # far inside 90 min. A healthy run is never killed by this.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The host that runs this job's two rung-1 builds comes from the flake:
      # `packages.monadHost` is `cargo build -p monad-cli`, hermetically, and
      # MONAD_HOST_BIN is the knob scripts/build-self-hosted.sh already takes
      # for exactly this -- nix/monad.nix passes the same package the same way
      # (`lib.getExe`), and it is what removes `cargo run --release --`'s cold
      # fat-LTO build from this job. Nothing else here runs cargo, so the old
      # "Build release binary" step is gone rather than joined.
      #
      # A packaged host is not self-sufficient the way `cargo run` was: the
      # path it reads its stdlib from is compiled IN (core/src/term/module.rs's
      # `stdlib_dir()`), so a store host carries a `/build/<src>-source/init/src`
      # path that exists only while the build that made it runs. The script
      # therefore points it at THIS checkout via MONAD_STDLIB -- which is what
      # the rung should mean anyway: the interpreter reads the tree the
      # self-compile reads. Run 36236800752 is what happens without it:
      # `failed to read /build/qkmvxrw…-source/init/src/prelude.mo`.
      #
      # The COMPILER is deliberately not taken from the flake here, unlike in
      # the `test` job: both rung-1 builds below assert the
      # interpreted-vs-compiled comparison, which needs the `.ll` the
      # interpreter writes beside its output, and a store compiler has none
      # beside it (nix/monad.nix does not install one). Only the host is
      # packaged; the ladder stays a from-source build, in both build modes.
      - name: Build the host from the flake
        run: |
          host="$(nix build --no-link --print-out-paths --accept-flake-config .#monadHost)"
          echo "MONAD_HOST_BIN=$host/bin/monad-rs" >> "$GITHUB_ENV"

      # Both steps call their script directly rather than through
      # `devenv tasks run monad:bootstrap-compile` / `monad:debug-oracle` (the
      # local equivalents): devenv-tasks captures a task's stdout and shows it
      # only on failure, and here the output IS the diagnostic -- the compile's
      # --verbose per-module stage trace, and the oracle's per-file verdicts.
      #
      # The two steps must stay in one job: the oracle reuses the binary the
      # compile wrote to <checkout>/target-monad/bootstrap-ci/monad
      # (scripts/lib/bootstrap-dir.sh).
      - name: Bootstrap compiler
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/bootstrap-compile.sh
      - name: Debug transparency oracle
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/debug-oracle.sh
