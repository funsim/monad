name: Nightly release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same suppression as ci.yml: the devShell's shellHook runs the full
  # pre-commit sweep on every `nix develop -c` entry, and the nightly job
  # only needs to build and verify the binary. The sweep runs once per
  # pipeline in ci.yml's pre-commit-checks job; nothing here needs it.
  DEVENV_SKIP_TASKS: "1"

jobs:
  nightly:
    if: github.repository == 'monad-lang/monad'
    runs-on: [self-hosted, linux]
    # Hang guard: the self-compile has no deadline of its own (the CI
    # bootstrap task streams a --verbose stage trace instead), so this
    # is the only thing that stops a wedged run from holding the runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The interpreter that builds this artifact comes from the flake, the
      # same way the `bootstrap` job in ci.yml takes its host: a 2s store
      # lookup for a host that is already built, in place of the cold
      # `cargo run --release --` this job used to pay for on every merge to
      # main -- and it is cold every time, because actions/checkout cleans
      # the target directories at the start of every job and this job runs
      # once per merge.
      #
      # MONAD_HOST_BIN is the knob scripts/build-self-hosted.sh already takes
      # for exactly this; scripts/nightly-release.sh routes its build through
      # that script, so setting it here is the whole change. The script also
      # points the packaged host's stdlib at THIS checkout (MONAD_STDLIB),
      # which a store host needs: the path it reads init/src from is compiled
      # in, and for a store build that path exists only while the build that
      # made it runs.
      - name: Build the host from the flake
        run: |
          host="$(nix build --no-link --print-out-paths --accept-flake-config .#monadHost)"
          echo "MONAD_HOST_BIN=$host/bin/monad-rs" >> "$GITHUB_ENV"

      # The whole build -- compile, verification, staged artifacts and the
      # `tag`/`date` outputs the release step below reads -- happens inside
      # this one dev-shell entry. Two things drive the shape of it:
      #
      #   * a bare `run:` gets the RUNNER HOST's PATH, not the devenv's,
      #     which is how `file` went missing here while devenv.nix listed it;
      #   * the script writes those two step outputs itself, into
      #     $GITHUB_OUTPUT, so splitting them into a second `nix develop`
      #     entry would buy nothing and add a second way for the release job
      #     to fail over something that has nothing to do with the release.
      #     (Note it is the *outputs*, not the cost of a second entry, that
      #     decide this. A dev-shell entry is now cheap: DEVENV_SKIP_TASKS=1 is
      #     set at the workflow level above, so the shellHook's devenv-tasks
      #     invocation is suppressed. The outputs argument still holds --
      #     writing them here rather than in a second `nix develop -c` avoids
      #     a second way for the release job to fail over something unrelated
      #     to the release.)
      #
      # The script is called directly rather than through
      # `devenv tasks run monad:nightly` (which is the local equivalent):
      # devenv-tasks captures a task's stdout and shows it only on failure,
      # which would swallow the `file` output, the recorded commit and the
      # compile's --verbose stage trace -- the evidence that says what got
      # published.
      - name: Build and verify the nightly binary
        id: nightly
        run: |
          nix develop --no-pure-eval --accept-flake-config -c \
            scripts/nightly-release.sh

      - name: Create nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.nightly.outputs.tag }}
          name: Nightly ${{ steps.nightly.outputs.date }}
          body: |
            Automated nightly build of the bootstrapped `monad` binary from `main`.

            Commit: ${{ github.sha }}

            This binary is produced by the self-hosted compiler
            (`cli/src/main.mo`) compiling itself, run through the Rust
            `monad-rs` reference interpreter. Built on a self-hosted
            Linux x86_64 runner with Nix devenv.

            `monad-src-x86_64-linux.tar.gz` holds the `init`, `std`, `llvm`
            and `runtime` mote sources. `monadup` unpacks it beside the binary,
            and the compiler then resolves `use std::…` and the C runtime
            from that directory as a toolchain root — which is what lets a
            mote in its own repository build without a compiler checkout.
            (Older tags have no such asset: `monadup` installs the binary
            alone and says what is missing.)
          prerelease: true
          make_latest: false
          files: |
            dist/monad-nightly-x86_64-linux
            dist/monad-src-x86_64-linux.tar.gz
            dist/commit.txt
