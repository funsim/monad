# The `bootstrap` job from .github/workflows/ci.yml: the self-hosted compiler
# compiles itself, and then the binary that falls out has to do the job it was
# built for.
#
# These two steps MUST stay in one workflow file. `monad:debug-oracle` reuses
# the binary `monad:bootstrap-compile` just wrote to
# ${TMPDIR:-/tmp}/monad-bootstrap-ci/monad, and only steps *within* a workflow
# share a machine -- every workflow in a Spindle pipeline runs in its own
# microVM. Splitting them into two files would leave the oracle to rebuild the
# binary itself (its staleness check handles that case, by design) or, worse,
# to run against a stale one, which reports failures that are really its own
# age.
#
# The other half of that job's value is the pair of compiles: `--release` and
# then the default invocation, which is what users actually type and was broken
# for an unknown length of time precisely because nothing ran it. Both live in
# scripts/bootstrap-compile.sh, so both still run here -- see that script's
# header for why each one is worth its own compile.
#
# What this job takes from the flake is the HOST, not the compiler: the first
# step builds `packages.monadHost` and the two steps below name it through
# MONAD_HOST_BIN, which is what removes `cargo run --release --`'s cold build
# from the ladder. A packaged host cannot find its stdlib the way `cargo run`
# did -- that path is compiled in, and a nix build's is a `/build/...` one -- so
# scripts/build-self-hosted.sh points it at the checkout through MONAD_STDLIB,
# which is the only reason this job works at all (run 36236800752 failed on
# `failed to read /build/...-source/init/src/prelude.mo` before that line
# existed; the GitHub job's step comment says it in full).
# The compiler itself stays a from-source build here, unlike in
# the `test` job, because both rung-1 builds assert the
# interpreted-vs-compiled comparison and a store compiler has no
# interpreter-produced `.ll` beside it -- the GitHub job's step comment says it
# in full. Same `VAR=...` reasoning as .tangled/workflows/test.yml for why the
# path is resolved in each step rather than in `environment:`.
#
# Both steps call their script directly rather than through `devenv tasks run`
# (the local equivalents), as the GitHub job does: devenv-tasks captures a
# task's stdout and shows it only on failure, and here the output IS the
# diagnostic -- the compile's --verbose per-module stage trace, and the
# oracle's per-file verdicts.
environment:
  DEVENV_SKIP_TASKS: "1"

when:
  - event: ["push", "pull_request"]
    branch: ["main"]
  - event: ["manual"]

engine: microvm
image: nixos

dependencies:
  - git

steps:
  - name: Build the host from the flake
    command: nix build --no-link --accept-flake-config .#monadHost

  - name: Bootstrap compiler
    command: |
      MONAD_HOST_BIN="$(nix build --no-link --print-out-paths --accept-flake-config .#monadHost)/bin/monad-rs" \
        nix develop --no-pure-eval --accept-flake-config -c \
          scripts/bootstrap-compile.sh

  - name: Debug transparency oracle
    command: |
      MONAD_HOST_BIN="$(nix build --no-link --print-out-paths --accept-flake-config .#monadHost)/bin/monad-rs" \
        nix develop --no-pure-eval --accept-flake-config -c \
          scripts/debug-oracle.sh
