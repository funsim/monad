# Virtual workspace root for the monad repository: no [mote] of its own,
# just the list of motes it contains. See plans/packaging/package-system.md
# section 5a.
#
# Manifests in this repo are written with sub-table headers
# ([dependencies.std]) rather than inline tables ({ path = "../std" }),
# because the self-hosted reader (lang/src/toml.mo) supports headers and
# not inline tables. Both spellings mean the same thing to the Rust host.

# Build output goes to `target/monad`, not `target/`, because **cargo owns
# `target/debug` and `target/release` in this same repository**: sharing the
# directory would mean `cargo clean` deletes monad's build store and
# `monad clean` deletes cargo's artifacts. A user whose project has no
# Cargo.toml needs none of this and gets the plain `target/` default.
[build]
target-dir = "target/monad"

[workspace]
members = [
  "init",
  "std",
  "lang",
  "cli",
  "llvm",
  "runtime",
  "build",
  "slow_tests",
  "bench",
  "proofs",
  "motes/*",
]
